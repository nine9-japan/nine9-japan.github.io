<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>My Links</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background-color: #fafafa;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 440px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #111827;
      letter-spacing: -0.01em;
    }
    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 16px 18px;
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    a:hover {
      border-color: #9ca3af;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .title {
      font-size: 1rem;
      font-weight: 500;
      color: #111827;
    }
    .url {
      font-size: 0.8rem;
      color: #6b7280;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main>
    <h1>My Links</h1>
    <ul>
      <li>
        <a href="https://nine9-japan.github.io/university-notes-pages/" target="_blank" rel="noopener noreferrer">
          <span class="title">大学ノート庫</span>
          <span class="url">nine9-japan.github.io/university-notes-pages</span>
        </a>
      </li>
      <li>
        <a href="https://nine9-japan.github.io/recordingnote/" target="_blank" rel="noopener noreferrer">
          <span class="title">RecordingNote</span>
          <span class="url">nine9-japan.github.io/recordingnote</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
